server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://127.0.0.1:5500"
              - "http://localhost:5500"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
      routes:
        - id: cliente-route
          uri: lb://CLIENTE-SERVICE
          predicates:
          - Path=/api/clientes, /api/clientes/**

        - id: mascota-route
          uri: lb://MASCOTA-SERVICE
          predicates:
            - Path=/api/mascotas, /api/mascotas/**

        - id: cita-service
          uri: lb://CITA-SERVICE
          predicates:
            - Path=/api/citas/**

        - id: medicamento-service
          uri: lb://MEDICAMENTO-SERVICE
          predicates:
            - Path=/api/medicamentos/**

        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

