server:
  port: 8080

spring:
  application:
    name: GATEWAY-SERVICE
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: cliente-route
          uri: lb://CLIENTE-SERVICE
          predicates:
            - Path=/api/clientes, /api/clientes/**

        - id: mascota-route
          uri: lb://MASCOTA-SERVICE
          predicates:
            - Path=/api/mascotas, /api/mascotas/**

        - id: cita-service
          uri: lb://CITA-SERVICE
          predicates:
            - Path=/api/citas/**

        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

