server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: identity-service
          uri: lb://IDENTITY-Service
          predicates:
            - Path=/api/auth/**
        - id: cliente-service
          uri: lb://CLIENTE-Service
          predicates:
            - Path=/api/clientes/**
        - id: mascota-service
          uri: lb://MASCOTA-Service
          predicates:
            - Path=/api/mascotas/**
        - id: cita-service
          uri: lb://CITA-Service
          predicates:
            - Path=/api/citas/**


