<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - VetSystem</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="body-auth">
    <div class="auth-card">
        <h2>Crear Cuenta</h2>
        <form id="formRegistro">
            <div class="input-group">
                <label>Nuevo Usuario</label>
                <input type="text" id="regUsername" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="regPassword" required>
            </div>
            <div class="input-group">
                <label>Rol</label>
                <select id="regRol">
                    <option value="ADMIN">ADMIN</option>
                    <option value="USER">USER</option>
                </select>
            </div>
            <button type="submit" class="btn-success">Registrarse y Obtener Token</button>
            <p id="successMsg" class="success-msg" style="display:none;">¡Cuenta creada! Redirigiendo...</p>
        </form>
        <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
