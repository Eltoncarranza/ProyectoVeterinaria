<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinaria</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">
        <h1>Gestión de Mascotas</h1>
        
        <!-- Formulario para agregar mascota -->
        <div class="tarjeta">
            <h2>Registrar Nueva Mascota</h2>
            <form id="formularioMascota">
                <div class="grupo-input">
                    <label>Nombre de la Mascota:</label>
                    <input type="text" id="nombreMascota" required placeholder="Ej. Firulais">
                </div>
                <div class="grupo-input">
                    <label>Raza:</label>
                    <input type="text" id="razaMascota" required placeholder="Ej. Labrador">
                </div>
                <button type="submit" class="btn-guardar">Guardar Mascota</button>
            </form>
        </div>

        <!-- Lista donde aparecerán las mascotas -->
        <div class="tarjeta">
            <h2>Lista de Mascotas</h2>
            <ul id="listaMascotas" class="lista">
                <!-- Las mascotas se cargarán aquí por JavaScript -->
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
