<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Citas - VetSystem Pro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🐾 VetSystem Pro</div>
        <div class="nav-links">
            <a href="clientes.html">Clientes</a>
            <a href="mascotas.html">Mascotas</a>
            <a href="citas.html" class="active">Citas</a>
            <a href="medicamentos.html">Medicamentos</a>
        </div>
        <button id="btnCerrarSesion" class="btn-danger">Cerrar Sesión</button>
    </nav>

    <div class="main-container">
        <h1>Agenda y Calendario de Citas</h1>
        
        <div class="card">
            <h3>Agendar Nueva Cita</h3>
            <form id="formCita">
                <div class="input-group">
                    <label>Seleccionar Mascota (Paciente)</label>
                    <select id="mascotaId" required>
                        <option value="">Cargando mascotas...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Fecha y Hora</label>
                    <input type="datetime-local" id="fecha" required>
                </div>
                <div class="input-group">
                    <label>Motivo de la Consulta</label>
                    <input type="text" id="motivo" required placeholder="Ej: Control general y vacunas">
                </div>
                <button type="submit" class="btn-success">Agendar Cita en Agenda</button>
            </form>
        </div>

        <!-- Vista tipo Agenda / Calendario Dinámico -->
        <div class="card">
            <h3>Vista de Citas Programadas</h3>
            <div id="agendaContenedor" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px;">
                <!-- Las tarjetas de citas se cargarán aquí dinámicamente -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/citas.js"></script>
</body>
</html>
