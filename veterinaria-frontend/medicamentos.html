<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Medicamentos - VetSystem</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🐾 VetSystem Pro</div>
        <div class="nav-links">
            <a href="clientes.html">Clientes</a>
            <a href="mascotas.html">Mascotas</a>
            <a href="citas.html">Citas</a>
            <a href="medicamentos.html" class="active">Medicamentos</a>
        </div>
        <button id="btnCerrarSesion" class="btn-danger">Cerrar Sesión</button>
    </nav>

    <div class="main-container">
        <h1>Inventario de Medicamentos</h1>
        
        <div class="card">
            <h3>Registrar Medicamento</h3>
            <form id="formMedicamento">
                <div class="input-group">
                    <label>Nombre del Medicamento</label>
                    <input type="text" id="nombreMed" required placeholder="Ej: Amoxicilina">
                </div>
                <div class="input-group">
                    <label>Stock / Cantidad</label>
                    <input type="number" id="stockMed" required placeholder="Ej: 50">
                </div>
                <div class="input-group">
                    <label>Precio Unitario ($)</label>
                    <input type="number" step="0.01" id="precioMed" required placeholder="Ej: 15.50">
                </div>
                <button type="submit" class="btn-success">Guardar Medicamento</button>
            </form>
        </div>

        <div class="card">
            <h3>Stock Disponible</h3>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Stock</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody id="tablaMedicamentos">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/medicamentos.js"></script>
</body>
</html>
