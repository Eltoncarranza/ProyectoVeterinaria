<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes - VetSystem</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🐾 VetSystem Pro</div>
        <div class="nav-links">
            <a href="clientes.html" class="active">Clientes</a>
            <a href="mascotas.html">Mascotas</a>
            <a href="citas.html">Citas</a>
            <a href="medicamentos.html">Medicamentos</a>
        </div>
        <button id="btnCerrarSesion" class="btn-danger">Cerrar Sesión</button>
    </nav>

    <div class="main-container">
        <h1>Gestión de Clientes</h1>
        
        <div class="card">
            <h3>Registrar Nuevo Cliente</h3>
            <form id="formCliente">
                <div class="input-group">
                    <label>DNI</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="dniCliente" placeholder="Ingrese DNI" maxlength="8" required>
                        <button type="button" id="btnBuscarDni" class="btn-info">🔍 Buscar RENIEC</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>Nombres</label>
                    <input type="text" id="nombreCliente" required readonly placeholder="Se autocompletará">
                </div>
                <div class="input-group">
                    <label>Apellidos</label>
                    <!-- Agregamos este campo para los apellidos -->
                    <input type="text" id="apellidosCliente" required readonly placeholder="Se autocompletará">
                </div>
                <div class="input-group">
                    <label>Teléfono</label>
                    <input type="text" id="telefonoCliente" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="emailCliente" required>
                </div>
                <button type="submit" class="btn-success">Guardar Cliente</button>
            </form>
        </div>

        <div class="card">
            <h3>Listado de Clientes</h3>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>DNI</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="tablaClientes">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
