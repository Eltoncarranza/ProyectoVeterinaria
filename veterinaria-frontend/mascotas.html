<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mascotas - VetSystem Pro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🐾 VetSystem Pro</div>
        <div class="nav-links">
            <a href="clientes.html">Clientes</a>
            <a href="mascotas.html" class="active">Mascotas</a>
            <a href="citas.html">Citas</a>
            <a href="medicamentos.html">Medicamentos</a>
        </div>
        <button id="btnCerrarSesion" class="btn-danger">Cerrar Sesión</button>
    </nav>
    <div class="main-container">
        <h1>Gestión de Mascotas</h1>
        
        <div class="card">
            <h3>Registrar Nueva Mascota</h3>
            <form id="formMascota">
                <div class="input-group">
                    <label>Dueño (Cliente)</label>
                    <select id="clienteId" required>
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nombre de la Mascota</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="input-group">
                    <label>Especie</label>
                    <select id="especieSelect" required>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <input type="text" id="especieOtro" placeholder="Especifique la especie" style="display:none; margin-top: 10px;">
                </div>
                <div class="input-group">
                    <label>Raza</label>
                    <input type="text" id="raza" required>
                </div>
                <div class="input-group">
                    <label>Edad (Años)</label>
                    <input type="number" id="edad" required min="0">
                </div>
                <button type="submit" class="btn-success">Guardar Mascota</button>
            </form>
        </div>

        <div class="card">
            <h3>Listado de Mascotas</h3>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Raza</th>
                        <th>Dueño</th>
                        <th class="solo-admin">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMascotas">

                </tbody>
            </table>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/mascotas.js"></script>
</body>
</html>
